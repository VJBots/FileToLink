<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Jinja2 ব্যবহার করে ডায়নামিক ফাইলের নাম -->
  <title>{{ file_name }}</title>

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .plyr {
      width: 100%;
      height: 100%;
    }
    .plyr__video-wrapper {
      height: 100%;
    }
    video {
      object-fit: contain;
      transition: filter 0.05s linear;
    }

    /* স্ক্রিনের ওপর ভলিউম ও ব্রাইটনেস ইন্ডিকেটর বক্স */
    .indicator-box {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 20, 0.85);
      padding: 12px 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .indicator-box.show {
      opacity: 1;
    }
    .indicator-icon {
      font-size: 22px;
      color: #fff;
    }
    .progress-bar-bg {
      width: 150px;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 50%;
      background: #4caf50;
      border-radius: 4px;
      transition: width 0.05s ease;
    }
  </style>
</head>
<body>

  <div class="player-wrapper" id="gestureArea">
    <!-- ওএসডির মতো ভাসমান কন্ট্রোল নির্দেশক -->
    <div class="indicator-box" id="indicator">
      <span class="indicator-icon" id="indicatorIcon">🔊</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="indicatorFill"></div>
      </div>
    </div>

    <!-- ভিডিও প্লেয়ার -->
    <video id="player" playsinline controls>
      <!-- render_template.py এর সাথে মিল রেখে ডায়নামিক ভিডিও লিঙ্ক যুক্ত করা হয়েছে -->
      <source src="{{ file_url }}" type="video/mp4" />
    </video>
  </div>

  <!-- Plyr JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen']
    });

    const gestureArea = document.getElementById('gestureArea');
    const indicator = document.getElementById('indicator');
    const indicatorIcon = document.getElementById('indicatorIcon');
    const indicatorFill = document.getElementById('indicatorFill');
    const videoElement = document.querySelector('video');

    let isDragging = false;
    let startY = 0;
    let isLeftSide = false;
    let currentVolume = 1; // 0 to 1
    let currentBrightness = 1; // 0.2 to 1.8
    let hideTimeout;

    function showIndicator(icon, percent, color = '#4caf50') {
      indicatorIcon.textContent = icon;
      indicatorFill.style.width = `${percent}%`;
      indicatorFill.style.backgroundColor = color;
      indicator.classList.add('show');

      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        indicator.classList.remove('show');
      }, 1000);
    }

    // মাউস/টাচ শুরু
    function handleStart(clientX, clientY) {
      isDragging = true;
      startY = clientY;
      const rect = gestureArea.getBoundingClientRect();
      isLeftSide = clientX < (rect.left + rect.width / 2);
    }

    // মাউস/টাচ মুভমেন্ট
    function handleMove(clientY) {
      if (!isDragging) return;

      const deltaY = startY - clientY; // উপরে সোয়াইপ করলে পজিটিভ
      startY = clientY; // স্মুথ স্ক্রোলিংয়ের জন্য

      const sensitivity = 0.005;

      if (isLeftSide) {
        // ব্রাইটনেস কন্ট্রোল (বাম পাশ)
        currentBrightness += deltaY * sensitivity;
        currentBrightness = Math.max(0.2, Math.min(1.8, currentBrightness));
        videoElement.style.filter = `brightness(${currentBrightness})`;

        const bPercent = Math.round(((currentBrightness - 0.2) / 1.6) * 100);
        showIndicator('☀️', bPercent, '#ffffff');
      } else {
        // ভলিউম কন্ট্রোল (ডান পাশ)
        currentVolume += deltaY * sensitivity;
        currentVolume = Math.max(0, Math.min(1, currentVolume));
        player.volume = currentVolume;

        const vPercent = Math.round(currentVolume * 100);
        showIndicator(currentVolume === 0 ? '🔇' : '🔊', vPercent, '#4caf50');
      }
    }

    function handleEnd() {
      isDragging = false;
    }

    // Touch Events (Mobile)
    gestureArea.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY);
    });
    gestureArea.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) handleMove(e.touches[0].clientY);
    });
    gestureArea.addEventListener('touchend', handleEnd);

    // Mouse Drag Events (PC testing)
    gestureArea.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handleMove(e.clientY));
    window.addEventListener('mouseup', handleEnd);

    // রাইট ক্লিক বন্ধ রাখা
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>

</body>
</html>
